; NEXA CONFIG

; Can be 2, 3, or 4 || SEASON OG STAGES
RufusStage=4

; WATERLEVEL C2 S3 

; VALUE SHOULD BE 1 - 7
WaterLevel=3

; ============================================
; NETWORK / LAN CONFIGURATION
; ============================================

[Network]

; Your local IP address on the LAN (the PC running this backend + game server)
; Your brother connects to this IP
; To find your IP: run "ipconfig" in cmd and look for IPv4 Address
LanIP=192.168.16.102

; Backend HTTP server settings
; Host 0.0.0.0 = listen on ALL network interfaces (required for LAN)
; Host 127.0.0.1 = localhost only (no LAN access)
Host=0.0.0.0
BackendPort=3551

; Game Server port (Unreal Engine dedicated server / listen server)
; This is where Fortnite connects when you press "Play"
; Default: 7777
GameServerPort=7777

; Matchmaker WebSocket port
; The matchmaker handles the queue simulation (Connecting → Waiting → Queued → Join)
; Default: 5555
MatchmakerPort=5555 